# Лёгкий sync: merge upstream → ветка + PR (без --tags clobber)
name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      open_pr:
        description: "Создать PR (иначе только ветка)"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/vernette/warpscout.git
          git fetch upstream master
          git fetch origin master

      - name: Detect divergence
        id: info
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          AHEAD=$(git rev-list --count upstream/master..HEAD)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Upstream ahead of fork by $BEHIND commit(s); fork ahead by $AHEAD"
          if [ "$BEHIND" = "0" ]; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into sync branch
        if: steps.info.outputs.uptodate != 'true'
        id: merge
        run: |
          set -e
          DATE=$(date -u +%Y%m%d)
          BRANCH="sync/upstream-${DATE}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH" origin/master

          set +e
          git merge --no-edit -m "merge: vernette/warpscout master" upstream/master
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            git status --porcelain | while read -r st f; do
              case "$st" in UU|AA|DU|UD|UA|AU|DD) ;; *) continue ;; esac
              [ -n "$f" ] || continue
              case "$f" in
                installer_warpscout.sh|.github/workflows/*)
                  git checkout --ours -- "$f" 2>/dev/null || true
                  git add -- "$f" 2>/dev/null || true
                  ;;
                *)
                  git checkout --theirs -- "$f" 2>/dev/null || true
                  git add -- "$f" 2>/dev/null || true
                  ;;
              esac
            done
            if git diff --name-only --diff-filter=U | grep -q .; then
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit -m "merge: vernette/warpscout master (auto-resolved)"
          fi

          git checkout origin/master -- .github/workflows/ 2>/dev/null || true
          if ! git diff --quiet HEAD -- .github/workflows/ 2>/dev/null; then
            git add .github/workflows/
            git commit -m "chore: keep fork .github/workflows after upstream merge" || true
          fi
          if git show origin/master:installer_warpscout.sh >/dev/null 2>&1; then
            git checkout origin/master -- installer_warpscout.sh
            if ! git diff --quiet HEAD -- installer_warpscout.sh 2>/dev/null; then
              git add installer_warpscout.sh
              git commit -m "chore: keep fork installer_warpscout.sh" || true
            fi
          fi

          git push -u origin "$BRANCH" --force-with-lease
          echo "Compare: https://github.com/${{ github.repository }}/compare/master...${BRANCH}?expand=1"

      - name: Open PR
        if: steps.info.outputs.uptodate != 'true' && (github.event_name == 'schedule' || inputs.open_pr)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.merge.outputs.branch }}"
          REPO="${{ github.repository }}"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open"
            exit 0
          fi
          gh pr create --base master --head "$BRANCH" \
            --title "chore: sync upstream vernette/warpscout ($(date -u +%Y-%m-%d))" \
            --body "Автосинхронизация с vernette/warpscout. installer и workflows — из форка." \
            || echo "Open manually: https://github.com/${REPO}/compare/master...${BRANCH}?expand=1"
